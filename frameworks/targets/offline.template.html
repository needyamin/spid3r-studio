<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_TITLE}} — Offline</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: {{BG_COLOR}}; color: #0f172a; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; }
  .card { max-width: 420px; width: 100%; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 24px; box-shadow: 0 8px 24px rgba(15,23,42,0.08); text-align: center; }
  h1 { margin: 0 0 8px; font-size: 20px; }
  p { margin: 0 0 18px; color: #475569; font-size: 14px; line-height: 1.5; }
  a.btn { display: inline-block; padding: 10px 18px; border-radius: 10px; background: {{THEME_COLOR}}; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
  <main class="card" role="main">
    <h1>{{APP_TITLE}} is offline</h1>
    <p>You are currently disconnected from the network. Reconnect and retry to load fresh data.</p>
    <a class="btn" href="./index.html">Retry</a>
  </main>
</body>
</html>
