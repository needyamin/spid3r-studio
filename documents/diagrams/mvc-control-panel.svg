<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
  <defs>
    <linearGradient id="mvcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101e"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mvcHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="1100" height="470" rx="16" fill="url(#mvcBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <rect x="24" y="20" width="1052" height="50" rx="10" fill="url(#mvcHead)"/>
  <text x="44" y="44" fill="#ffffff" font-size="17.5" font-weight="800">Spid3r Studio Control Panel — Model–View–Controller (MVC) &amp; Self-Healing Engine</text>
  <text x="44" y="61" fill="#e0f2fe" font-size="11.5" font-weight="500">core/gui/models/*  •  core/gui/pages/*  •  core/gui/controllers/*  •  core/{Diagnostics,Recovery,Plugins}.matrix</text>

  <!-- Box 1: VIEWS -->
  <rect x="28" y="92" width="320" height="352" rx="12" fill="#151e32" stroke="#6366f1" stroke-width="2"/>
  <text x="46" y="118" fill="#818cf8" font-size="14" font-weight="800">VIEWS (core/gui/pages/* &amp; Shell.matrix)</text>
  <text x="46" y="136" fill="#94a3b8" font-size="11">Declarative UI Trees + Multi-Tab Console Drawer</text>

  <rect x="44" y="148" width="288" height="38" rx="7" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="171" fill="#e2e8f0" font-size="12" font-weight="600">1. Workspace.matrix — 5-Tier Map &amp; Scaffolder</text>

  <rect x="44" y="194" width="288" height="38" rx="7" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="217" fill="#e2e8f0" font-size="12" font-weight="600">2. Editor.matrix — .matrix Editor &amp; Debugger</text>

  <rect x="44" y="240" width="288" height="38" rx="7" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="263" fill="#e2e8f0" font-size="12" font-weight="600">3. Platforms.matrix — 6-OS Build &amp; Deploy Matrix</text>

  <rect x="44" y="286" width="288" height="38" rx="7" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="309" fill="#e2e8f0" font-size="12" font-weight="600">4. Doctor.matrix — downloads/ &amp; 1-Click SDKs</text>

  <rect x="44" y="332" width="288" height="38" rx="7" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="355" fill="#e2e8f0" font-size="12" font-weight="600">5. Tests.matrix — 3-Stage QA &amp; Dry-Run Runner</text>

  <rect x="44" y="378" width="288" height="38" rx="7" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="401" fill="#e2e8f0" font-size="12" font-weight="600">6. Docs.matrix — Guides, Logs Export &amp; Plugins</text>

  <!-- Box 2: CONTROLLERS -->
  <rect x="404" y="92" width="300" height="352" rx="12" fill="#151e32" stroke="#06b6d4" stroke-width="2"/>
  <text x="422" y="118" fill="#22d3ee" font-size="14" font-weight="800">CONTROLLERS (core/gui/controllers/*)</text>
  <text x="422" y="136" fill="#94a3b8" font-size="11">User Action Dispatch &amp; Background Workers</text>

  <rect x="420" y="152" width="268" height="132" rx="9" fill="#0f172a" stroke="#0891b2"/>
  <text x="434" y="174" fill="#67e8f9" font-size="12.5" font-weight="700">StudioController.matrix</text>
  <text x="434" y="194" fill="#cbd5e1" font-size="11">• create_workspace_project()</text>
  <text x="434" y="212" fill="#cbd5e1" font-size="11">• save_current_editor_file() (No BOM)</text>
  <text x="434" y="230" fill="#cbd5e1" font-size="11">• compile_and_diagnose_project()</text>
  <text x="434" y="248" fill="#cbd5e1" font-size="11">• trigger_auto_recovery()</text>
  <text x="434" y="266" fill="#cbd5e1" font-size="11">• export_diagnostic_logs()</text>

  <rect x="420" y="298" width="268" height="126" rx="9" fill="#0f172a" stroke="#0891b2"/>
  <text x="434" y="320" fill="#67e8f9" font-size="12.5" font-weight="700">Jobs.matrix (Async Worker Pool)</text>
  <text x="434" y="340" fill="#cbd5e1" font-size="11">• run_async() via spawn fn()</text>
  <text x="434" y="358" fill="#cbd5e1" font-size="11">• start_web_server() / stop_web_server()</text>
  <text x="434" y="376" fill="#cbd5e1" font-size="11">• launch_native_preview() &amp; hot-reload</text>
  <text x="434" y="394" fill="#cbd5e1" font-size="11">• appkit.request_render() UI sync</text>

  <!-- Box 3: MODELS & CORE ENGINE -->
  <rect x="760" y="92" width="312" height="170" rx="12" fill="#151e32" stroke="#10b981" stroke-width="2"/>
  <text x="778" y="118" fill="#34d399" font-size="14" font-weight="800">MODELS (core/gui/models/*)</text>
  <text x="778" y="140" fill="#cbd5e1" font-size="11.5">• StudioModel.matrix (5-Tier Inventory, Editor</text>
  <text x="788" y="157" fill="#cbd5e1" font-size="11.5">Buffer, Notifications, Vendor Sync, Docs)</text>
  <text x="778" y="177" fill="#cbd5e1" font-size="11.5">• Toolchain.matrix (6-OS Probes, Readiness</text>
  <text x="788" y="194" fill="#cbd5e1" font-size="11.5">Calculator, Missing Dependency Recommender)</text>
  <text x="778" y="216" fill="#6ee7b7" font-size="11" font-family="ui-monospace, Consolas, monospace">studio/State.matrix + studio/Storage.matrix</text>

  <rect x="760" y="274" width="312" height="170" rx="12" fill="#151e32" stroke="#a855f7" stroke-width="2"/>
  <text x="778" y="300" fill="#c084fc" font-size="14" font-weight="800">CORE ENGINE (core/*.matrix)</text>
  <text x="778" y="322" fill="#cbd5e1" font-size="11.5">• Diagnostics.matrix: Parses errors &amp; maps</text>
  <text x="788" y="339" fill="#cbd5e1" font-size="11.5">Spid3r BUG-01..BUG-10 to fix suggestions</text>
  <text x="778" y="359" fill="#cbd5e1" font-size="11.5">• Recovery.matrix: Strips BOM, runs 2-pass</text>
  <text x="788" y="376" fill="#cbd5e1" font-size="11.5">spid3r fmt, syncs vendor/studio, exports logs</text>
  <text x="778" y="396" fill="#cbd5e1" font-size="11.5">• Plugins.matrix: Bundler &amp; Target SDK Registry</text>

  <!-- Arrows between Views, Controllers, Models, and Core -->
  <line x1="348" y1="215" x2="398" y2="215" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrCyan)"/>
  <text x="353" y="205" fill="#7dd3fc" font-size="10" font-weight="600">UI Events</text>

  <line x1="704" y1="185" x2="754" y2="185" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrGreen)"/>
  <text x="708" y="175" fill="#6ee7b7" font-size="10" font-weight="600">Mutates</text>

  <line x1="704" y1="345" x2="754" y2="345" stroke="#c084fc" stroke-width="2.2" marker-end="url(#arrPurple)"/>
  <text x="708" y="335" fill="#d8b4fe" font-size="10" font-weight="600">Invokes</text>

  <path d="M 760 125 C 560 72, 490 72, 354 125" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrGreen)"/>
  <text x="515" y="83" fill="#6ee7b7" font-size="10.5" font-weight="600">Reactive Render &amp; DOM Morph (window.__studio.patch)</text>
</svg>
