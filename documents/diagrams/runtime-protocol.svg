<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
  <defs>
    <linearGradient id="rtBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eff3f8"/>
    </linearGradient>
    <linearGradient id="rtHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d5e0eb"/>
      <stop offset="100%" stop-color="#c4d3e3"/>
    </linearGradient>
    <marker id="rtArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#326791"/>
    </marker>
    <marker id="rtArrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#326791"/>
    </marker>
  </defs>

  <rect width="1100" height="430" rx="16" fill="url(#rtBg)" stroke="#c3cedb" stroke-width="2"/>

  <!-- Header -->
  <rect x="24" y="20" width="1052" height="50" rx="10" fill="url(#rtHead)"/>
  <text x="44" y="44" fill="#101e2f" font-size="17.5" font-weight="800">Dual-Mode Runtime Architecture — Native Desktop Bridge vs. WebWorker WASM Protocol</text>
  <text x="44" y="61" fill="#2b3d51" font-size="11.5" font-weight="500">Identical app.matrix Codebase  •  Keyed DOM Morphing (ClientJS.matrix)  •  Atomic @@STUDIO_FRAME@@ JSON Protocol</text>

  <!-- Top Track: Native Desktop Mode -->
  <rect x="28" y="88" width="1044" height="150" rx="12" fill="#e7edf4" stroke="#326791" stroke-width="1.8"/>
  <text x="48" y="114" fill="#1d4e7a" font-size="13.5" font-weight="800">MODE A: NATIVE DESKTOP RUNTIME (Windows • macOS • Linux — spid3r gui &amp; build --target desktop)</text>

  <rect x="48" y="128" width="220" height="92" rx="9" fill="#fafbfd" stroke="#326791"/>
  <text x="64" y="150" fill="#1d4e7a" font-size="12.5" font-weight="700">1. main.matrix Entry Shims</text>
  <text x="64" y="170" fill="#3a4b5f" font-size="11">Links 5 entry-only natives:</text>
  <text x="64" y="188" fill="#3f5165" font-size="10.5" font-family="ui-monospace, Consolas, monospace">gui_title, gui_set_html,</text>
  <text x="64" y="204" fill="#3f5165" font-size="10.5" font-family="ui-monospace, Consolas, monospace">gui_eval, gui_on, gui_emit</text>

  <rect x="308" y="128" width="235" height="92" rx="9" fill="#fafbfd" stroke="#326791"/>
  <text x="324" y="150" fill="#1d4e7a" font-size="12.5" font-weight="700">2. Persistent Spid3r VM</text>
  <text x="324" y="170" fill="#3a4b5f" font-size="11">In-memory State, Router &amp;</text>
  <text x="324" y="188" fill="#3a4b5f" font-size="11">atomic disk Storage (kv.json).</text>
  <text x="324" y="205" fill="#326791" font-size="10.5" font-family="ui-monospace, Consolas, monospace">Bridge.dispatch_safe(ev)</text>

  <rect x="583" y="128" width="225" height="92" rx="9" fill="#fafbfd" stroke="#326791"/>
  <text x="599" y="150" fill="#1d4e7a" font-size="12.5" font-weight="700">3. Render &amp; Host Effects</text>
  <text x="599" y="170" fill="#3a4b5f" font-size="11">Escaped HTML tree + CSS</text>
  <text x="599" y="188" fill="#3a4b5f" font-size="11">variables + effect queue</text>
  <text x="599" y="205" fill="#3f5165" font-size="10.5" font-family="ui-monospace, Consolas, monospace">flush_native_effects()</text>

  <rect x="848" y="128" width="204" height="92" rx="9" fill="#fafbfd" stroke="#326791"/>
  <text x="864" y="150" fill="#1d4e7a" font-size="12.5" font-weight="700">4. Native WebView2 / GTK</text>
  <text x="864" y="170" fill="#3a4b5f" font-size="11">ClientJS.matrix patches DOM</text>
  <text x="864" y="188" fill="#3a4b5f" font-size="11">preserving focus &amp; inputs</text>
  <text x="864" y="205" fill="#326791" font-size="10.5" font-family="ui-monospace, Consolas, monospace">window.__studio.patch()</text>

  <line x1="268" y1="174" x2="302" y2="174" stroke="#326791" stroke-width="2" marker-end="url(#rtArrow)"/>
  <line x1="543" y1="174" x2="577" y2="174" stroke="#326791" stroke-width="2" marker-end="url(#rtArrow)"/>
  <line x1="808" y1="174" x2="842" y2="174" stroke="#326791" stroke-width="2" marker-end="url(#rtArrow)"/>

  <!-- Bottom Track: Web / Android / iOS WASM Mode -->
  <rect x="28" y="254" width="1044" height="154" rx="12" fill="#e7edf4" stroke="#326791" stroke-width="1.8"/>
  <text x="48" y="280" fill="#1d4e7a" font-size="13.5" font-weight="800">MODE B: STATELESS WASM REPL PROTOCOL (Web/PWA • Android WebViewAssetLoader • iOS WKURLSchemeHandler)</text>

  <rect x="48" y="294" width="220" height="94" rx="9" fill="#fafbfd" stroke="#326791"/>
  <text x="64" y="316" fill="#1d4e7a" font-size="12.5" font-weight="700">1. FlatKit Single-File Bundle</text>
  <text x="64" y="336" fill="#3a4b5f" font-size="11">Bundles studio/* + pages/*</text>
  <text x="64" y="354" fill="#3a4b5f" font-size="11">with isolated module globals</text>
  <text x="64" y="372" fill="#3f5165" font-size="10.5" font-family="ui-monospace, Consolas, monospace">app.wasm_run(EVENT_JSON)</text>

  <rect x="308" y="294" width="235" height="94" rx="9" fill="#fafbfd" stroke="#326791"/>
  <text x="324" y="316" fill="#1d4e7a" font-size="12.5" font-weight="700">2. FIFO Event Envelope</text>
  <text x="324" y="336" fill="#3a4b5f" font-size="11">Main thread posts JSON:</text>
  <text x="324" y="354" fill="#3f5165" font-size="10.5" font-family="ui-monospace, Consolas, monospace">{ event, router, state,</text>
  <text x="324" y="370" fill="#3f5165" font-size="10.5" font-family="ui-monospace, Consolas, monospace">  storage, theme, caps }</text>

  <rect x="583" y="294" width="225" height="94" rx="9" fill="#fafbfd" stroke="#326791"/>
  <text x="599" y="316" fill="#1d4e7a" font-size="12.5" font-weight="700">3. Web Worker (spid3r.wasm)</text>
  <text x="599" y="336" fill="#3a4b5f" font-size="11">Evaluates turn off-main-thread</text>
  <text x="599" y="354" fill="#3a4b5f" font-size="11">&amp; emits 1 atomic stdout line:</text>
  <text x="599" y="372" fill="#326791" font-size="10.5" font-family="ui-monospace, Consolas, monospace">@@STUDIO_FRAME@@\n{...}</text>

  <rect x="848" y="294" width="204" height="94" rx="9" fill="#fafbfd" stroke="#326791"/>
  <text x="864" y="316" fill="#1d4e7a" font-size="12.5" font-weight="700">4. DOM Patch &amp; Effects</text>
  <text x="864" y="336" fill="#3a4b5f" font-size="11">Morphs HTML, persists to</text>
  <text x="864" y="354" fill="#3a4b5f" font-size="11">localStorage &amp; runs fetch()</text>
  <text x="864" y="372" fill="#326791" font-size="10.5" font-family="ui-monospace, Consolas, monospace">window.__studio.runEffects()</text>

  <line x1="268" y1="341" x2="302" y2="341" stroke="#326791" stroke-width="2" marker-end="url(#rtArrowGreen)"/>
  <line x1="543" y1="341" x2="577" y2="341" stroke="#326791" stroke-width="2" marker-end="url(#rtArrowGreen)"/>
  <line x1="808" y1="341" x2="842" y2="341" stroke="#326791" stroke-width="2" marker-end="url(#rtArrowGreen)"/>
</svg>
